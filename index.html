<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IBKR" />
    <meta name="application-name" content="IBKR" />
    <meta name="theme-color" content="#000000" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="dark" />
    <title>IBKR</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/assets/interactive-brokers.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/interactive-brokers.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="phone" id="phone">
      <div class="phone-status" aria-hidden="true">
        <span class="phone-time" id="phone-time">9:41</span>
        <span class="phone-island"></span>
        <span class="phone-stats">
          <i class="sig"></i>
          <i class="wifi"></i>
          <i class="bat"></i>
        </span>
      </div>

      <div class="app" id="app">
        <main class="screen" id="view"></main>
        <div id="overlays"></div>
        <div id="toast" class="toast"></div>
        <nav class="bottom-nav" id="nav" aria-label="Primary">
          <button type="button" data-tab="watchlist" aria-label="Watchlist">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m12 4.8 2.1 4.3 4.7.7-3.4 3.3.8 4.7L12 15.6 7.8 17.8l.8-4.7-3.4-3.3 4.7-.7Z" />
            </svg>
            <span>Watchlist</span>
          </button>
          <button type="button" data-tab="home" aria-label="Home">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m4.5 11 7.5-6.5L19.5 11" />
              <path d="M7 10.5V19h10v-8.5" />
            </svg>
            <span>Home</span>
          </button>
          <button type="button" data-tab="quote" aria-label="Quote">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11.5" cy="12" r="6.2" />
              <path d="M16.2 16.6 19 19.5" />
            </svg>
            <span>Quote</span>
          </button>
          <button type="button" data-tab="search" aria-label="Search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" />
              <path d="m16.2 16.2 3.3 3.3" />
            </svg>
            <span>Search</span>
          </button>
          <button type="button" data-tab="account" aria-label="Account">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="9" r="3.2" />
              <path d="M6.2 18.5c1.4-2.2 3.3-3.3 5.8-3.3s4.4 1.1 5.8 3.3" />
            </svg>
            <span>Account</span>
          </button>
        </nav>
      </div>

      <div class="phone-home" aria-hidden="true"></div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
